name: Release

# Publish to npm with provenance on version tags (v0.1.0, v0.2.0, ...).
# Publishes via npm trusted publishing (OIDC): no token secret. The npm package
# must list this repo's release workflow as a trusted publisher.
#
# The job runs in the "npm-publish" environment so a human can be required to
# approve each publish (Settings > Environments > npm-publish > Required
# reviewers). See RELEASING.md. Until that environment has protection rules the
# job runs without waiting.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so we can tell whether the tag is on main
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Release tags must point at a commit that has been merged to main."
            exit 1
          fi
      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Bump package.json first."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc -p tsconfig.test.json
      - run: npx vitest run
      - run: npm run build
      - name: Update npm (OIDC trusted publishing needs >= 11.5)
        run: npm install -g npm@12
      - run: npm publish --provenance --access public

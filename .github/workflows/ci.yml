name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # vitest does not type-check, so test files need their own pass (they are
      # excluded from the build config).
      - run: npx tsc -p tsconfig.test.json
      - run: npx vitest run
      - run: npm run build
      - name: Verify publishable contents
        run: npm pack --dry-run
